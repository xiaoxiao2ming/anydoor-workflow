<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作流编辑器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 标题栏 -->
<div class="titlebar" id="titlebar">
  <div class="titlebar-drag">
    <span class="app-icon">⬡</span>
    <span class="app-title">工作流编辑器</span>
    <span class="file-name" id="fileName">未命名.wf</span>
  </div>
  <div class="titlebar-controls">
    <button class="tb-btn" id="btnMin" title="最小化">─</button>
    <button class="tb-btn" id="btnMax" title="最大化">□</button>
    <button class="tb-btn danger" id="btnClose" title="关闭">✕</button>
  </div>
</div>

<!-- 主体 -->
<div class="app-body">

  <!-- 左侧节点面板 -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <p class="sidebar-label">添加节点</p>
      <div class="node-palette">
        <div class="palette-item" draggable="true" data-type="start">
          <div class="palette-shape start-shape"></div>
          <span>开始</span>
        </div>
        <div class="palette-item" draggable="true" data-type="end">
          <div class="palette-shape end-shape"></div>
          <span>结束</span>
        </div>
        <div class="palette-item" draggable="true" data-type="task">
          <div class="palette-shape task-shape"></div>
          <span>任务</span>
        </div>
        <div class="palette-item" draggable="true" data-type="decision">
          <div class="palette-shape decision-shape"></div>
          <span>判断</span>
        </div>
        <div class="palette-item" draggable="true" data-type="subprocess">
          <div class="palette-shape subprocess-shape"></div>
          <span>子流程</span>
        </div>
      </div>
    </div>

    <div class="sidebar-section">
      <p class="sidebar-label">操作</p>
      <button class="sidebar-btn" id="btnFit">适应屏幕</button>
      <button class="sidebar-btn" id="btnClear">清空画布</button>
      <button class="sidebar-btn" id="btnSave">保存文件</button>
      <button class="sidebar-btn" id="btnOpen">打开文件</button>
    </div>

    <div class="sidebar-section zoom-section">
      <p class="sidebar-label">缩放 <span id="zoomLabel">100%</span></p>
      <input type="range" id="zoomSlider" min="20" max="200" value="100">
    </div>
  </aside>

  <!-- 画布区 -->
  <main class="canvas-wrap">
    <!-- 工具栏 -->
    <div class="toolbar">
      <button class="tool-btn active" id="toolSelect" title="选择 (V)">
        <svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 1l10 5.5-5 1.5-2 5z" fill="currentColor"/></svg>
        选择
      </button>
      <button class="tool-btn" id="toolConnect" title="连线 (C)">
        <svg width="14" height="14" viewBox="0 0 14 14"><line x1="2" y1="12" x2="12" y2="2" stroke="currentColor" stroke-width="1.5"/><circle cx="2" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="2" r="2" fill="currentColor"/></svg>
        连线
      </button>
      <div class="toolbar-sep"></div>
      <button class="tool-btn icon-only" id="btnUndo" title="撤销 (Ctrl+Z)">↩</button>
      <button class="tool-btn icon-only" id="btnRedo" title="重做 (Ctrl+Y)">↪</button>
      <div class="toolbar-sep"></div>
      <button class="tool-btn icon-only" id="btnDeleteSelected" title="删除选中 (Del)">🗑</button>
    </div>

    <!-- SVG 画布 -->
    <div class="canvas-container" id="canvasContainer">
      <svg id="mainSvg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#888" />
          </marker>
          <marker id="arrow-selected" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#3B6D11" />
          </marker>
          <marker id="arrow-hover" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#378ADD" />
          </marker>
          <marker id="arrow-detach" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#E8600A" />
          </marker>
          <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e0ddd5" stroke-width="0.5"/>
          </pattern>
        </defs>
        <g id="gridLayer">
          <rect width="9999" height="9999" x="-4999" y="-4999" fill="url(#grid)" />
        </g>
        <g id="edgeLayer"></g>
        <g id="nodeLayer"></g>
        <g id="tempLayer"></g>
      </svg>
    </div>

    <!-- 小地图 -->
    <div class="minimap" id="minimap">
      <canvas id="minimapCanvas" width="160" height="100"></canvas>
    </div>
  </main>

  <!-- 右侧属性面板 -->
  <aside class="props-panel" id="propsPanel">
    <div class="props-header">属性</div>
    <div class="props-body" id="propsBody">
      <div class="props-empty">选中节点或连线以查看属性</div>
    </div>
  </aside>

</div>

<!-- 右键菜单 -->
<div class="ctx-menu hidden" id="ctxMenu">
  <div class="ctx-item" id="ctxDelete">删除</div>
  <div class="ctx-item" id="ctxDuplicate">复制</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" id="ctxBringFront">置于顶层</div>
  <div class="ctx-item" id="ctxSendBack">置于底层</div>
  <!-- 拆离区域：动态注入 -->
  <div id="ctxDetachArea"></div>
</div>

<script src="canvas.js"></script>
</body>
</html>
