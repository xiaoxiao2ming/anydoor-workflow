    <!--
      初始标题只作首帧占位：React 挂载后 App.tsx 的 useEffect 会把 document.title
      同步成「当前画布名」，宿主（WorkBuddy 预览面板 / 浏览器标签 / Electron 窗口）
      显示的就是它。这里不再写死项目名，否则换画布后宿主标题与画布名对不上。
    -->
    <title>任意门</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // ★ 启动看门狗（2026-10-11）：首启竞态（渲染层先于内部服务就绪发起首屏请求，
      //   请求挂起 → 界面永远停在启动屏）→ 12 秒仍未挂载出内容就自动重载一次。
      //   sessionStorage 标记防循环：每个窗口生命周期只自动重试一次，二次仍空说明真故障。
      ;(function () {
        setTimeout(function () {
          try {
            var root = document.getElementById('root')
            var empty = !root || root.innerHTML.length < 500
            if (empty && !sessionStorage.getItem('__bootRetried')) {
              sessionStorage.setItem('__bootRetried', '1')
              location.reload()
            }
          } catch (e) { /* ignore */ }
        }, 12000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
